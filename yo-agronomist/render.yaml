services:
  - type: web
    name: yo-agronomist-api
    runtime: node
    plan: free
    rootDir: apps/api
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: JWT_SECRET
        generateValue: true
      - key: APP_BASE_URL
        value: https://your-app.vercel.app
      - key: ADMIN_BASE_URL
        value: https://your-admin.vercel.app
      - key: API_BASE_URL
        value: https://yo-agronomist-api.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: yo-agronomist-db
          property: connectionString

databases:
  - name: yo-agronomist-db
    plan: free
    databaseName: yo_agronomist
    user: yo_agronomist_user
